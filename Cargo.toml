[package]
build = "src/build.rs"
edition = "2021"
name = "naive"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
ammonia = "4.1.4"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
diesel = { version = "2.3.13", features = [
    "chrono",
    "r2d2",
    "sqlite",
] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
feed-rs = "2.4.0"
hex = "0.4.3"
hmac = "0.13.0"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
r-cache = "0.5.0"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
