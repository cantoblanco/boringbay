<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{% endblock %} | 无聊湾 🥱 The Boring Bay</title>
    <link rel="shortcut icon" href="/api/favicon/boringbay.com" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css">
    <script type="module" src="/static/app.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="activity-toasts" data-activity-toasts aria-live="polite" aria-atomic="false"></div>
    <div class="page-wrapper with-navbar">
        <nav class="navbar" aria-label="主要导航">
            <div class="container navbar-inner">
                <a href="/" class="navbar-brand" rel="noreferrer">
                    <img src="/api/icon/boringbay.com" alt="" width="40" height="40"> 无聊湾
                </a>
                <div class="navbar-content">
                    <button class="btn btn-action" type="button" data-theme-toggle aria-label="切换昼夜模式">◐</button>
                    <a class="btn" href="/rank">排行榜</a>
                    <a class="btn" href="/join-us">一起无聊？</a>
                </div>
            </div>
        </nav>

        <main id="main-content" class="content-wrapper">
            <div class="container">
                {% block content %}{% endblock %}
            </div>

            <aside class="activity-rail container" aria-labelledby="activity-title" data-activity-rail>
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">LIVE</p>
                        <h2 id="activity-title">湾内动态</h2>
                    </div>
                    <button type="button" class="quiet-button" data-activity-pause aria-pressed="false">暂停</button>
                </div>
                <ol class="activity-list" data-activity-list aria-live="polite">
                    <li class="activity-empty">正在等一阵海风……</li>
                </ol>
            </aside>

            <div class="text-center community-note">
                QQ 交流群：136231667（仅限会员加入）<br>
                <img class="mt-5" height="30" src="/api/badge/boringbay.com" alt="无聊湾动态徽章">
            </div>

            <blockquote class="brand-quote">
                生命的终极就是无聊，一般的流行文化很容易过时，但是无聊的终极文化永远伴随人类。—— @wdctll
            </blockquote>

            <footer>
                build · <a target="_blank" rel="noopener" href="https://github.com/cantoblanco/boringbay/commit/{{version}}">{{version}}</a>
                &copy; <a rel="noreferrer" href="https://boringbay.com">无聊湾 boringbay.com</a>
            </footer>
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
